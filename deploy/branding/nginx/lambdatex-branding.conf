# LambdaTeX branding: add the theme stylesheet and script to every HTML page.
# Mounted into the sharelatex container at /etc/nginx/conf.d/ (http context).
# Works because the web upstream sends uncompressed HTML; nginx gzips after this.

# The app sends a per-request CSP nonce with 'strict-dynamic'; reuse it so the
# script is allowed without loosening the policy.
map $sent_http_content_security_policy $lt_csp_nonce {
    default "";
    "~'nonce-(?<lt_nonce>[A-Za-z0-9+/=]+)'" $lt_nonce;
}

sub_filter_once on;
sub_filter '</head>' '<link rel="stylesheet" href="/img/lambdatex/lambdatex.css?v=7"><script defer nonce="$lt_csp_nonce" src="/img/lambdatex/lambdatex.js?v=1"></script></head>';
