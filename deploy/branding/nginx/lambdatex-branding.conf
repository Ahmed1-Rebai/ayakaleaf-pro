# LambdaTeX branding: add the theme stylesheet to every HTML page.
# Mounted into the sharelatex container at /etc/nginx/conf.d/ (http context).
# Works because the web upstream sends uncompressed HTML; nginx gzips after this.
sub_filter_types text/html;
sub_filter_once on;
sub_filter '</head>' '<link rel="stylesheet" href="/img/lambdatex/lambdatex.css?v=4"></head>';
