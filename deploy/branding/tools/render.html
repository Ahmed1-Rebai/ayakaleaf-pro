<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.185.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.185.1/examples/jsm/"}}</script>
<style>html,body{margin:0;background:transparent}</style></head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
// Light/dark presets copied from lambda-website apps/web/src/components/lambda-hero/lambda-scene.ts
const THEMES = {
  dark:  { emissiveIntensity: 0.8,  exposure: 0.85, ambient: 0.34, keyLight: 30, sunLight: 1.6, rimLight: 2.6, envIntensity: 0.5 },
  light: { emissiveIntensity: 0.32, exposure: 1.02, ambient: 0.75, keyLight: 46, sunLight: 2.5, rimLight: 1.1, envIntensity: 1.05 },
};
const EMISSIVE_BY_PREFIX = { lambda_stroke: 1, lambda_star: 1.35 };
const gltf = await new GLTFLoader().loadAsync("3dlambda.glb");
window.renderMark = ({ theme = "light", size = 1200, yaw = 0, pitch = 0, margin = 1.55, overrides = {}, weights = null, gloss = null } = {}) => {
  const t = { ...THEMES[theme], ...overrides };
  const W = weights || EMISSIVE_BY_PREFIX;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(size, size); renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = t.exposure;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100); camera.position.set(0, 0.1, 5);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = t.envIntensity;
  scene.add(new THREE.AmbientLight(0xbcd8ff, t.ambient));
  const key = new THREE.PointLight(0xffffff, t.keyLight, 40, 2); key.position.set(2.2, 2.4, 4.4); camera.add(key); scene.add(camera);
  const sun = new THREE.DirectionalLight(0xffffff, t.sunLight); sun.position.set(1.1, 5.4, 1.3); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x7dd3fc, t.rimLight); rim.position.set(-3.4, 1.4, -3.8); scene.add(rim);
  const model = gltf.scene.clone(true);
  model.getObjectByName("Cube")?.removeFromParent();
  const box = new THREE.Box3().setFromObject(model), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const s = 2 / Math.max(sz.x, sz.y, sz.z);
  model.position.sub(c); model.scale.setScalar(s); model.position.multiplyScalar(s);
  model.traverse((o) => {
    if (!o.isMesh) return;
    let n = o, w = 0;
    while (n && !w) { for (const [p, v] of Object.entries(W)) if ((n.name || "").startsWith(p)) w = v; n = n.parent; }
    o.material = o.material.clone();
    if (gloss) { o.material.roughness = gloss.roughness; o.material.metalness = gloss.metalness; }
    if (w) { o.material.emissive.copy(o.material.color); o.material.emissiveIntensity = t.emissiveIntensity * w; }
  });
  const pivot = new THREE.Group(); pivot.add(model); pivot.rotation.y = yaw;
  const tilt = new THREE.Group(); tilt.add(pivot); tilt.rotation.x = pitch; scene.add(tilt);
  const tanV = Math.tan(THREE.MathUtils.degToRad(19));
  const dist = Math.max((sz.y / 2) * s / tanV, (Math.hypot(sz.x, sz.z) / 2) * s / tanV) * margin;
  camera.position.setLength(dist); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL("image/png");
  renderer.dispose();
  return url;
};
window.ready = true;
</script></body></html>
