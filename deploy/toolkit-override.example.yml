# Copy to <toolkit>/config/docker-compose.override.yml (the toolkit auto-loads that name).
# All AI_* settings, including the secret AI_API_KEY, live in ONE file: the git-ignored,
# chmod-600 .env at the root of this repository (template: .env.example).
# Paths assume the repository is cloned at /home/user/lambdatex; adjust if not.
---
services:
  sharelatex:
    env_file:
      - ../config/variables.env
      # Single source for AI_* settings incl. the API key (chmod 600, git-ignored)
      - /home/user/lambdatex/.env
      # LambdaTeX branding (no secrets)
      - /home/user/lambdatex/deploy/branding/branding.env
    volumes:
      # LambdaTeX theme: assets, stylesheet injection, replacement icons
      - /home/user/lambdatex/deploy/branding/lambdatex:/overleaf/services/web/public/img/lambdatex:ro
      - /home/user/lambdatex/deploy/branding/nginx:/etc/nginx/conf.d:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon.ico:/overleaf/services/web/public/favicon.ico:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon.svg:/overleaf/services/web/public/favicon.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon-16x16.png:/overleaf/services/web/public/favicon-16x16.png:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon-32x32.png:/overleaf/services/web/public/favicon-32x32.png:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/apple-touch-icon.png:/overleaf/services/web/public/apple-touch-icon.png:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/mask-favicon.svg:/overleaf/services/web/public/mask-favicon.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/web.sitemanifest.json:/overleaf/services/web/public/web.sitemanifest.json:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon-compiled.svg:/overleaf/services/web/public/favicon-compiled.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon-compiling.svg:/overleaf/services/web/public/favicon-compiling.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/favicon-error.svg:/overleaf/services/web/public/favicon-error.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/lambda-logo.svg:/overleaf/services/web/public/img/ol-brand/overleaf-o-dark.svg:ro
      - /home/user/lambdatex/deploy/branding/lambdatex/lambda-logo.svg:/overleaf/services/web/public/img/ol-brand/overleaf-o.svg:ro
      # Admin seed script (deploy/scripts/seed-admin.sh)
      - /home/user/lambdatex/deploy/scripts:/overleaf/services/web/modules/server-ce-scripts/scripts/lambdatex:ro
      # Server-side patch: drop earlier reasoning from AI chat history (deploy/patches/README.md)
      - /home/user/lambdatex/deploy/patches/workbench/WorkbenchTools.mjs:/overleaf/services/web/modules/workbench/app/src/WorkbenchTools.mjs:ro
      # Server-side patch: save images attached in the AI chat into the project
      - /home/user/lambdatex/deploy/patches/workbench/WorkbenchController.mjs:/overleaf/services/web/modules/workbench/app/src/WorkbenchController.mjs:ro
      - /home/user/lambdatex/deploy/patches/workbench/AttachedImageTool.mjs:/overleaf/services/web/modules/workbench/app/src/AttachedImageTool.mjs:ro
      # Server-side: saved AI conversations
      - /home/user/lambdatex/deploy/patches/workbench/WorkbenchRouter.mjs:/overleaf/services/web/modules/workbench/app/src/WorkbenchRouter.mjs:ro
      - /home/user/lambdatex/deploy/patches/workbench/ConversationStore.mjs:/overleaf/services/web/modules/workbench/app/src/ConversationStore.mjs:ro
      - /home/user/lambdatex/deploy/patches/workbench/ConversationController.mjs:/overleaf/services/web/modules/workbench/app/src/ConversationController.mjs:ro
      # Rebuilt editor frontend (deploy/frontend/build.sh): saved conversations UI
      - /home/user/lambdatex/deploy/frontend/dist/js:/overleaf/services/web/public/js:ro
      - /home/user/lambdatex/deploy/frontend/dist/stylesheets:/overleaf/services/web/public/stylesheets:ro
      - /home/user/lambdatex/deploy/frontend/dist/fonts:/overleaf/services/web/public/fonts:ro
      - /home/user/lambdatex/deploy/frontend/dist/images:/overleaf/services/web/public/images:ro
      - /home/user/lambdatex/deploy/frontend/dist/manifest.json:/overleaf/services/web/public/manifest.json:ro
