# Copy to <toolkit>/config/docker-compose.override.yml (the toolkit auto-loads that name).
# All AI_* settings, including the secret AI_API_KEY, live in ONE file: the
# git-ignored, chmod-600 .env at the root of this repository (template: .env.example).
# Adjust the absolute path to where you cloned the repository.
---
services:
  sharelatex:
    env_file:
      - ../config/variables.env
      - /home/user/ayakaleaf-pro/.env
